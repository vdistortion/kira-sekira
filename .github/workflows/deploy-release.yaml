name: Deploy Release

on:
  push:
    branches:
      - release
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/kira-sekira

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Собираем и пушим каждый образ последовательно
      - name: Build and push main
        uses: docker/build-push-action@v6
        with:
          context: .
          file: projects/main/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-main:release

      - name: Build and push models
        uses: docker/build-push-action@v6
        with:
          context: .
          file: projects/models/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-models:release

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DB_PASSWORD,DIRECTUS_KEY,DIRECTUS_SECRET,CORS_ORIGIN,PUBLIC_URL,GHCR_PAT,GHCR_USER,REPO_URL,ADMIN_EMAIL,ADMIN_PASSWORD,R2_ENDPOINT,R2_BUCKET,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY
          script: |
            set -e
            REPO_PATH=~/projects/kira-sekira
            if [ ! -d "$REPO_PATH" ]; then
              mkdir -p ~/projects
              git clone -b release "$REPO_URL" "$REPO_PATH"
            fi
            cd "$REPO_PATH"
            # .env is generated locally on the VPS and is gitignored/untracked.
            # Remove it (unstage if tracked, delete if untracked) so `git pull`
            # (which drops .env from tracking) does not abort on a conflict.
            git rm --cached -f .env >/dev/null 2>&1 || true
            rm -f .env
            git fetch origin release
            git reset --hard origin/release

              printf '%s\n' \
                "DB_PASSWORD='${DB_PASSWORD}'" \
                "DIRECTUS_KEY='${DIRECTUS_KEY}'" \
                "DIRECTUS_SECRET='${DIRECTUS_SECRET}'" \
                "CORS_ORIGIN='${CORS_ORIGIN}'" \
                "PUBLIC_URL='${PUBLIC_URL}'" \
                "ADMIN_EMAIL='${ADMIN_EMAIL}'" \
                "ADMIN_PASSWORD='${ADMIN_PASSWORD}'" \
                "R2_ENDPOINT='${R2_ENDPOINT}'" \
                "R2_BUCKET='${R2_BUCKET}'" \
                "R2_ACCESS_KEY_ID='${R2_ACCESS_KEY_ID}'" \
                "R2_SECRET_ACCESS_KEY='${R2_SECRET_ACCESS_KEY}'" \
                > .env

              docker network create caddy 2>/dev/null || true
              echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

              docker compose -f compose.release.yaml pull
              docker compose -f compose.release.yaml up -d

              # Directus готов — накатываем схему (коллекции/поля) и опционально демо-контент.
              # schema apply идемпотентен и безопасен при каждом деплое.
              for i in $(seq 1 60); do
                docker compose -f compose.release.yaml exec -T studio node -e "require('http').get('http://localhost:8055/server/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))" >/dev/null 2>&1 && break
                sleep 3
              done
              docker compose -f compose.release.yaml exec -T studio node cli.js schema apply --yes /directus/snapshots/schema.yaml
              docker compose -f compose.release.yaml exec -T studio python3 /directus/setup/permissions.py

              docker system prune --force
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DIRECTUS_KEY: ${{ secrets.DIRECTUS_KEY }}
          DIRECTUS_SECRET: ${{ secrets.DIRECTUS_SECRET }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.actor }}
          REPO_URL: https://${{ github.actor }}:${{ secrets.GHCR_PAT }}@github.com/${{ github.repository }}.git

      - name: Notify Telegram
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_ADMIN_ID }}" \
            -d text="🚀 kira-sekira deployed"

  delete-old-images:
    needs: [build-and-deploy]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        package: ['kira-sekira-main', 'kira-sekira-models']
    steps:
      - name: Delete untagged container versions for ${{ matrix.package }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ matrix.package }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -e
          echo "Fetching untagged versions for package $PACKAGE..."
          ids=$(gh api -H "Accept: application/vnd.github+json" \
            "/users/${OWNER}/packages/container/${PACKAGE}/versions?per_page=100" \
            --jq '.[] | select(.metadata.container.tags | length == 0) | .id')
          if [ -z "$ids" ]; then
            echo "No untagged versions found."
            exit 0
          fi
          for id in $ids; do
            echo "Deleting version $id..."
            gh api -X DELETE "/users/${OWNER}/packages/container/${PACKAGE}/versions/$id" || echo "Failed to delete version $id"
          done
