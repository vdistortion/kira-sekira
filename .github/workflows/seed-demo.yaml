name: Seed Demo Data

on:
  workflow_dispatch:
    inputs:
      skip_media:
        description: "Не заливать демо-фото (галереи/обложки) из picsum, только тексты/цены/отзывы/видео"
        type: boolean
        default: false
      reset_db:
        description: "Сбросить БД и применить схему заново (гарантирует корректную схему; контент пересоздаётся)"
        type: boolean
        default: true

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Seed demo content on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/projects/kira-sekira
            git fetch origin release
            git reset --hard origin/release

            if [ "${{ github.event.inputs.reset_db }}" = "true" ]; then
              echo "== resetting database =="
              docker compose -f compose.release.yaml stop studio
              docker compose -f compose.release.yaml exec -T db psql -U postgres -d studio -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
              docker compose -f compose.release.yaml up -d studio
            fi

            for i in $(seq 1 60); do
              docker compose -f compose.release.yaml exec -T studio node -e "require('http').get('http://localhost:8055/server/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))" >/dev/null 2>&1 && break
              sleep 3
            done

            docker compose -f compose.release.yaml exec -T studio node cli.js schema apply --yes /directus/snapshots/schema.yaml
            set -a; . ./.env; set +a
            python3 directus/setup/permissions.py
            python3 directus/setup/seed_core.py || true
            if [ "${{ github.event.inputs.skip_media }}" != "true" ]; then
              python3 directus/setup/seed_galleries.py || true
            fi
            python3 directus/setup/seed_models.py || true
            echo "demo data seeded"
