name: kira-sekira-release

services:
  db:
    container_name: kira-postgres-release
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: studio
    volumes:
      - postgres_data_release:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s

  studio:
    container_name: kira-studio-release
    image: ghcr.io/vdistortion/kira-sekira-studio:release
    pull_policy: always
    ports:
      - '127.0.0.1:8055:8055'
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      DB_CLIENT: pg
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: studio
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ENABLED: true
      CORS_ORIGIN: ${CORS_ORIGIN}
      PUBLIC_URL: ${PUBLIC_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      STORAGE_LOCATIONS: local,garage
      STORAGE_DEFAULT_LOCATION: garage
      STORAGE_GARAGE_DRIVER: s3
      STORAGE_GARAGE_KEY: ${GARAGE_ACCESS_KEY_ID}
      STORAGE_GARAGE_SECRET: ${GARAGE_SECRET_ACCESS_KEY}
      STORAGE_GARAGE_BUCKET: ${GARAGE_BUCKET}
      STORAGE_GARAGE_ENDPOINT: http://garage:3900
      STORAGE_GARAGE_REGION: garage
      STORAGE_GARAGE_FORCE_PATH_STYLE: 'true'
    volumes:
      - directus_uploads_release:/directus/uploads
      - ./directus/snapshots:/directus/snapshots
      - ./directus/extensions:/directus/extensions
      - ./directus/setup:/directus/setup:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - caddy
      - garage
    labels:
      caddy: studio.kira-sekira.ru
      caddy.encode: zstd gzip
      caddy.reverse_proxy: '{{upstreams 8055}}'
    restart: unless-stopped

  backup-web:
    container_name: kira-backup-web-release
    image: nginx:1.27-alpine
    profiles: [backups]
    restart: unless-stopped
    volumes:
      - ./backups:/usr/share/nginx/html:ro
      - ./infra/backup-web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/backup-web/index.html:/usr/share/nginx/html/index.html:ro
      - ./.backup-htpasswd:/etc/nginx/.htpasswd:ro
    networks:
      - caddy
    labels:
      caddy: backups.kira-sekira.ru
      caddy.encode: zstd gzip
      caddy.reverse_proxy: '{{upstreams 80}}'

  main:
    container_name: kira-main-release
    image: ghcr.io/vdistortion/kira-sekira-main:release
    restart: unless-stopped
    networks:
      - caddy
    labels:
      caddy: test.kira-sekira.ru
      caddy.reverse_proxy: '{{upstreams 80}}'

  models:
    container_name: kira-models-release
    image: ghcr.io/vdistortion/kira-sekira-models:release
    restart: unless-stopped
    networks:
      - caddy
    labels:
      caddy: 'yana.kira-sekira.ru kirochka.kira-sekira.ru'
      caddy.reverse_proxy: '{{upstreams 80}}'

volumes:
  postgres_data_release:
  directus_uploads_release:

networks:
  internal:
  caddy:
    external: true
  garage:
    external: true
