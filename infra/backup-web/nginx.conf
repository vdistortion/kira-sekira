server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;
    auth_basic "Backups";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location = / {
        try_files /index.html =404;
    }

    location / {
        add_header Content-Disposition 'attachment' always;
    }
}
