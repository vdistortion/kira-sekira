<div #gallery class="picture-list" [photoGalleryGroup]="{ history: true }">
  @for (row of rows; track $index) {
    <div class="picture-list__row" [style.height.px]="row.height">
      @for (image of row.images; track image.url) {
        <div class="picture-list__item" [style.width.px]="image.displayWidth" [photoGallery]="image.url">
          <app-picture-card [image]="image.url" [altText]="altText" [width]="image.width" [height]="image.height"></app-picture-card>
        </div>
      }
    </div>
  }
</div>
