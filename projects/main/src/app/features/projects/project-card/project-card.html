<div class="project-card">
  <app-card [project]="true">
    <div class="project-card__wrapper">
      <div class="project-card__cover">
        <img [src]="image" [alt]="title" />
        <div class="project-card__overlay">
          <div class="project-card__name">{{ title }}</div>
        </div>
      </div>
    </div>
  </app-card>
</div>
