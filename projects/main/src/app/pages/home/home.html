<app-page [title]="'Проекты'" [isHomePage]="true">
  @if (loading()) {
    <p style="text-align: center; color: var(--default-color)">Загрузка...</p>
  } @else if (error()) {
    <p style="text-align: center; color: red">{{ error() }}</p>
  } @else {
    <div class="home-page">
      @if (tagline()) {
        <h1 class="home-page__hero-title">{{ tagline() }}</h1>
      }
      @if (experienceText()) {
        <p class="home-page__hero-experience">{{ experienceText() }}</p>
      }
      <div class="home-page__item">
        <div class="home-page__image">
          <img [src]="aboutImage()" [alt]="projectsName()" />
        </div>
        <div class="home-page__content">
          @if (aboutMarkdown()) {
            <div [innerHTML]="aboutMarkdown() | markdown"></div>
          }
        </div>
      </div>
      <div #projectsTarget class="home-page__item">
        <div class="home-page__title">{{ projectsName() }}</div>
      </div>
      <app-project-list [galleries]="galleries()"></app-project-list>

      @if (videos().length) {
        <section id="videos" class="home-page__videos">
          <h2 class="section-title">Видео</h2>
          <div class="videos-grid">
            @for (video of videos(); track $index) {
              <div class="video-card">
                <iframe
                  class="video-card__iframe"
                  [src]="video.url | youtubeEmbed"
                  title="YouTube video player"
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                  allowfullscreen
                  loading="lazy"
                ></iframe>
              </div>
            }
          </div>
        </section>
      }
    </div>
  }
</app-page>
