@if (loading()) {
  <div class="loading">Загрузка...</div>
}

@if (gallery(); as g) {
  <div class="project-page">
    <div class="project-page__header">
      <a routerLink="/" class="project-page__back">← Назад в портфолио</a>
      <h1 class="project-page__title">{{ g.title }}</h1>
    </div>

    @if (g.description) {
      <div class="project-page__description" [innerHTML]="g.description | markdown"></div>
    }

    <div class="project-page__gallery">
      @for (img of g.images; track img.url) {
        <figure class="project-page__figure" [style.aspect-ratio]="img.width && img.height ? img.width + ' / ' + img.height : '4 / 3'">
          <img [src]="img.url" [alt]="g.title" [attr.width]="img.width || null" [attr.height]="img.height || null" loading="lazy" decoding="async" />
        </figure>
      }
    </div>
  </div>
}
